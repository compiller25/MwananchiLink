{% extends 'base.html' %}
{% block title %}OTP Verification | DCRS{% endblock %}
{% block content %}
<div class="narrow-panel glass-panel mx-auto">
  <h2 class="section-title">Verify one-time code</h2>
  <p class="text-muted">Enter the OTP sent to your phone number.</p>
  <form method="post" class="stack-form mt-4">
    {% csrf_token %}
    <div>
      <label class="form-label">OTP</label>
      {{ form.otp }}
    </div>
    <button class="btn btn-primary btn-lg" type="submit">Verify</button>
  </form>
</div>
{% endblock %}
