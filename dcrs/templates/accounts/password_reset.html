{% extends 'base.html' %}
{% block title %}Password Reset | DCRS{% endblock %}
{% block content %}
<div class="narrow-panel glass-panel mx-auto">
  <h2 class="section-title">Reset officer password</h2>
  <p class="text-muted">We’ll send reset instructions to the email linked to your account.</p>
  <form method="post" class="stack-form mt-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary btn-lg" type="submit">Send reset email</button>
  </form>
</div>
{% endblock %}
