<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430">
  <defs>
    <linearGradient id="phone-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="pin-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- city skyline -->
  <g fill="#ffffff" opacity="0.09">
    <rect x="20" y="330" width="70" height="100"/>
    <rect x="100" y="292" width="48" height="138"/>
    <rect x="158" y="350" width="84" height="80"/>
    <rect x="252" y="312" width="40" height="118"/>
    <rect x="302" y="340" width="66" height="90"/>
    <rect x="378" y="300" width="52" height="130"/>
    <rect x="440" y="352" width="90" height="78"/>
    <rect x="540" y="322" width="46" height="108"/>
  </g>
  <g fill="#ffffff" opacity="0.06">
    <rect x="60" y="368" width="30" height="62"/>
    <rect x="210" y="330" width="44" height="100"/>
    <rect x="500" y="342" width="34" height="88"/>
  </g>

  <!-- network nodes + dashed links -->
  <g stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="5,6" fill="none" opacity="0.6">
    <path d="M120,120 L258,176"/>
    <path d="M480,110 L366,180"/>
    <path d="M300,56 L282,150"/>
  </g>
  <g fill="#93c5fd">
    <circle cx="120" cy="120" r="6" fill="none" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="480" cy="110" r="6" fill="none" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="300" cy="56" r="7" fill="#bfdbfe"/>
  </g>

  <!-- large map pin -->
  <g transform="translate(462,228)">
    <circle cx="0" cy="14" r="58" fill="#ffffff" opacity="0.12"/>
    <path d="M0,0 C-22,0 -38,16 -38,38 C-38,64 0,96 0,96 C0,96 38,64 38,38 C38,16 22,0 0,0 Z" fill="url(#pin-g)"/>
    <circle cx="0" cy="36" r="16" fill="#ffffff" opacity="0.9"/>
    <path d="M0,22 a14,14 0 1,0 0.1,0" stroke="#dc2626" stroke-width="3" fill="none"/>
  </g>

  <!-- phone mockup -->
  <g transform="rotate(-4 296 258)">
    <rect x="196" y="120" width="196" height="250" rx="26" fill="#ffffff"/>
    <rect x="204" y="128" width="180" height="234" rx="18" fill="url(#phone-screen)"/>
    <rect x="266" y="136" width="56" height="8" rx="4" fill="#0f172a"/>
    <rect x="212" y="146" width="46" height="8" rx="4" fill="#93c5fd" opacity="0.6"/>
    <rect x="212" y="160" width="34" height="8" rx="4" fill="#bfdbfe" opacity="0.6"/>

    <rect x="214" y="186" width="160" height="92" rx="14" fill="#ffffff"/>
    <circle cx="234" cy="214" r="16" fill="#dcfce7"/>
    <path d="M227,214 l5,5 l9,-10" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="258" y="200" width="92" height="9" rx="4.5" fill="#0d1b3e"/>
    <rect x="258" y="216" width="70" height="8" rx="4" fill="#94a3b8"/>
    <rect x="326" y="248" width="44" height="16" rx="8" fill="#dcfce7"/>
    <text x="348" y="259" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#15803d">RESOLVED</text>

    <rect x="214" y="292" width="160" height="56" rx="14" fill="#ffffff"/>
    <circle cx="234" cy="320" r="13" fill="#fee2e2"/>
    <path d="M228,320 l12,-7 M241,320 l-12,-7" stroke="#dc2626" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <rect x="254" y="306" width="88" height="8" rx="4" fill="#0d1b3e"/>
    <rect x="254" y="320" width="60" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="326" y="314" width="40" height="15" rx="7.5" fill="#fee2e2"/>
    <text x="346" y="324" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c">ESCALATED</text>

    <rect x="214" y="356" width="160" height="10" rx="5" fill="#bfdbfe" opacity="0.8"/>
  </g>

  <!-- floating SMS chip -->
  <g transform="translate(120,250)">
    <rect width="138" height="44" rx="22" fill="#ffffff" opacity="0.95"/>
    <circle cx="22" cy="22" r="12" fill="#dbeafe"/>
    <path d="M16,22 l4,4 l8,-9" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="15" width="66" height="7" rx="3.5" fill="#0d1b3e"/>
    <rect x="42" y="27" width="46" height="6" rx="3" fill="#94a3b8"/>
  </g>

  <!-- floating badge chip -->
  <g transform="translate(262,76)">
    <rect width="118" height="34" rx="17" fill="#ffffff" opacity="0.95"/>
    <circle cx="17" cy="17" r="10" fill="#dcfce7"/>
    <text x="17" y="21" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11">✓</text>
    <rect x="34" y="12" width="52" height="7" rx="3.5" fill="#0d1b3e"/>
    <rect x="34" y="22" width="34" height="5" rx="2.5" fill="#94a3b8"/>
  </g>
</svg>
